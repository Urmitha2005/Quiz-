<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Student Profile</title>

<link rel="stylesheet"
href="profile.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<div class="container">

<h1>
👤 Student Profile
</h1>

<div class="profile-card">

<div class="avatar">

👨‍🎓

</div>

<h2 id="studentName">
Student Name
</h2>

<div class="stats">

<div class="stat">
<h3 id="totalAttempts">0</h3>
<p>Attempts</p>
</div>

<div class="stat">
<h3 id="averageScore">0%</h3>
<p>Average Score</p>
</div>

<div class="stat">
<h3 id="highestScore">0%</h3>
<p>Highest Score</p>
</div>

</div>

</div>

<h2>
🏆 Achievements
</h2>

<div id="badges">

</div>

<button onclick="goHome()">

🏠 Home

</button>

</div>

<script src="profile.js"></script>

</body>

</html>
